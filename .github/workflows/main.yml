name: LLM Observability API CI/CD

on:
  push:
    branches: [ "main", "waqfi_experiments" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: api
        run: pytest api/test_app.py monitoring/exporters/test_nvml_exporter.py -v
      - name: Run Postman collection (Newman)
        working-directory: api
        run: |
          python -m uvicorn app:app --port 5000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 1; done
          npx --yes newman@6 run postman/llm-observability-api.postman_collection.json \
            -e postman/local.postman_environment.json --bail
      - name: Run Security Scan
        run: bandit -r api monitoring -x ./api/test_app.py,./monitoring/exporters/test_nvml_exporter.py

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/monitoring/prometheus/prometheus.yml:/prometheus.yml \
            --entrypoint promtool \
            prom/prometheus:latest \
            check config /prometheus.yml

  build-images-dryrun:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: llm-observability-api
            context: .
            dockerfile: ./api/Dockerfile
          - image_name: llm-observability-grafana
            context: .
            dockerfile: ./docker/grafana/Dockerfile
          - image_name: llm-observability-prometheus
            context: .
            dockerfile: ./docker/prometheus/Dockerfile
          - image_name: llm-observability-nvml-exporter
            context: .
            dockerfile: ./monitoring/exporters/Dockerfile.nvml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image_name }}:ci-test

  publish-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: llm-observability-api
            context: .
            dockerfile: ./api/Dockerfile
          - image_name: llm-observability-grafana
            context: .
            dockerfile: ./docker/grafana/Dockerfile
          - image_name: llm-observability-prometheus
            context: .
            dockerfile: ./docker/prometheus/Dockerfile
          - image_name: llm-observability-nvml-exporter
            context: .
            dockerfile: ./monitoring/exporters/Dockerfile.nvml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}