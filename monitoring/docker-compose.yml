services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.116.1}
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol/config.yml
    ports:
      - "4318:4318"   # OTLP HTTP receiver (aiperf --otel-url)
      - "8889:8889"   # Prometheus exporter (scraped by prometheus)
    networks:
      - monitoring

  # NVML-based GPU exporter for the laptop (WSL2), where DCGM cannot run.
  # Emits DCGM_FI_DEV_* metric names on the same port 9400, so Prometheus and
  # Grafana are none the wiser. Mutually exclusive with dcgm-exporter via
  # profiles (local vs server), so both binding 9400 never conflicts.
  nvml-exporter:
    build:
      context: ..
      dockerfile: monitoring/exporters/Dockerfile.nvml
    container_name: nvml-exporter
    restart: unless-stopped
    profiles:
      - local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    ports:
      - "9400:9400"
    networks:
      - monitoring

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

