global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

  - job_name: otel_collector
    static_configs:
      - targets:
          - otel-collector:8889
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: dcgm_exporter
    static_configs:
      - targets:
          - dcgm-exporter:9400
    metrics_path: /metrics
  

  - job_name: vllm
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
