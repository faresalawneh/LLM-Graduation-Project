global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel_collector
    static_configs:
      - targets:
          - otel-collector:8889
    metrics_path: /metrics
    scrape_interval: 5s

  # GPU metrics from nvml-exporter, which emits DCGM-named gauges. The job
  # keeps the dcgm_exporter name so existing queries and dashboards still match.
  - job_name: dcgm_exporter
    static_configs:
      - targets:
          - nvml-exporter:9400
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: /metrics
