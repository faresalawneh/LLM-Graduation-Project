global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel_collector
    static_configs:
      - targets:
          - otel-collector:8889
    metrics_path: /metrics
    scrape_interval: 5s

  # One job for GPU metrics in both environments: dcgm-exporter resolves on
  # the server (profile: server), nvml-exporter on the laptop (profile: local).
  # Only one exists at a time; the other target just shows DOWN.
  - job_name: dcgm_exporter
    static_configs:
      - targets:
          - dcgm-exporter:9400
          - nvml-exporter:9400
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: /metrics
